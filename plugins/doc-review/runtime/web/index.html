<!doctype html>
<!--
  web/index.html (P3; CONTRACTS §12.0.1, §12.0.2). server/static.ts (P1) replaces the meta placeholder below with
  the mdr-* meta tags; under `npm run dev` the serve-only Vite plugin does the same from the dev server. The static
  body is the §12.0.1 shell (host ids included) so the first paint and any no-JS fetch see it; main.tsx then renders

-->

    <title>mdr</title>

    <link rel="stylesheet" crossorigin href="/assets/index-D8n3CcXp.css">

  <body>
    <div id="mdr-app" class="mdr-app" data-mode="editing">

    </div>
